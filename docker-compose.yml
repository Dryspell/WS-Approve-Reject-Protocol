services:
  spacetimedb:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # HTTP API
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
    volumes:
      - spacetimedb_data:/stdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  spacetimedb_data: 